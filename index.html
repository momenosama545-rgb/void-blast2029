<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Void Blast - Cyberpunk Future Edition</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #050814;
            --cell-empty: rgba(0, 240, 255, 0.05);
            --neon-blue: #00f0ff;
            --neon-pink: #ff007f;
            --neon-purple: #7000ff;
            --cyber-green: #00ff66;
            --cyber-yellow: #ffeb3b;
            --grid-cell: 10.5vw; 
            --max-grid-cell: 42px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; }

        body {
            margin: 0; background: var(--bg-dark);
            display: flex; flex-direction: column; align-items: center;
            font-family: 'Courier New', 'Segoe UI', Tahoma, monospace, sans-serif; 
            overflow: hidden; color: white;
            position: fixed; width: 100%; height: 100%;
            background-image: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
        }

        /* Modals & Overlays */
        #name-overlay, #multiplayer-menu, #shop-modal, #game-over-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0c102b 0%, #02040a 100%);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 2000; text-align: center;
            border: 2px solid var(--neon-blue);
            box-shadow: inset 0 0 30px rgba(0, 240, 255, 0.2);
        }

        #shop-modal { z-index: 3500; display: none; padding: 20px; box-sizing: border-box; }
        #game-over-modal { display: none; z-index: 5000; border-color: var(--neon-pink); box-shadow: 0 0 40px var(--neon-pink); }

        #menu-title {
            font-size: 3.2rem; font-weight: 900;
            background: linear-gradient(to right, #00f0ff, #ff007f, #7000ff, #00f0ff);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: cyber-shimmer 3s linear infinite; margin: 0;
            filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.8));
            letter-spacing: 3px;
        }

        .input-style {
            padding: 14px; border-radius: 8px; border: 2px solid var(--neon-blue);
            background: rgba(5, 12, 30, 0.9); color: var(--neon-blue); font-size: 1.2rem; margin: 15px; text-align: center;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); outline: none; font-family: inherit;
        }

        .btn-ui {
            padding: 12px 28px; font-size: 1.1rem; background: linear-gradient(45deg, #7000ff, #00f0ff);
            color: #ffffff; border: none; border-radius: 8px; cursor: pointer;
            margin: 6px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-ui:active { transform: scale(0.95); }

        /* Controls & Speed Settings */
        #settings-gear-container {
            position: absolute; top: 15px; left: 15px; z-index: 3000;
            display: flex; align-items: center; gap: 10px;
        }

        #gear-icon {
            width: 36px; height: 36px; cursor: pointer;
            filter: drop-shadow(0 0 10px var(--neon-blue));
            animation: gear-rotate 15s linear infinite;
        }

        @keyframes gear-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #speed-panel {
            background: rgba(10, 16, 35, 0.95);
            border: 1.5px solid var(--neon-blue);
            border-radius: 10px; padding: 8px 15px;
            display: none; align-items: center; gap: 12px;
            box-shadow: 0 4px 20px rgba(0,240,255,0.3);
            animation: fadeIn 0.3s ease forwards;
        }

        .speed-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(0,240,255,0.4);
            color: #ccc; padding: 5px 12px; border-radius: 6px; font-size: 0.85rem;
            cursor: pointer; transition: 0.2s; font-weight: bold; font-family: inherit;
        }
        .speed-btn.active {
            background: var(--neon-blue); color: #000; box-shadow: 0 0 12px var(--neon-blue);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10deg); } to { opacity: 1; transform: translateX(0); } }

        /* Stats Header */
        .header-stats { width: 95%; margin-top: 55px; }
        .score-container { display: flex; justify-content: space-around; width: 100%; align-items: center; }
        .score-box h2 { font-size: 0.8rem; margin: 0; color: #94a3b8; letter-spacing: 1px; text-transform: uppercase; }
        .score-box p { font-size: 1.4rem; margin: 2px 0; font-weight: 900; color: #fff; }

        .coin-box {
            display: flex; align-items: center; gap: 5px; background: rgba(255, 235, 59, 0.1);
            border: 1px solid var(--cyber-yellow); padding: 4px 12px; border-radius: 20px;
            box-shadow: 0 0 10px rgba(255, 235, 59, 0.3); cursor: pointer;
        }
        .coin-icon { font-size: 1.2rem; filter: drop-shadow(0 0 5px var(--cyber-yellow)); }
        #coin-count { color: var(--cyber-yellow); font-weight: bold; font-size: 1.2rem; }

        #best-score {
            display: inline-block;
            background: linear-gradient(90deg, #00f0ff, #ff007f, #00ff66, #00f0ff);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 1.6rem !important; filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.8));
            animation: cyber-shimmer 2s linear infinite, score-pulse 1.5s ease-in-out infinite;
        }

        @keyframes cyber-shimmer { to { background-position: 200% center; } }
        @keyframes score-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        #opponent-box { border: 2px dashed var(--neon-pink); padding: 5px 15px; border-radius: 8px; display: none; background: rgba(255,0,127,0.08); }

        /* Grid Area */
        #grid-wrapper {
            padding: 10px; border-radius: 12px; position: relative; margin-top: 10px;
            border: 3px solid var(--neon-blue);
            background: rgba(3, 7, 18, 0.85) !important;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(0, 240, 255, 0.2);
            overflow: hidden;
        }

        #grid {
            display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px;
            width: calc(8 * var(--grid-cell) + 35px); max-width: calc(8 * var(--max-grid-cell) + 35px);
            background: transparent !important;
        }

        .cell { 
            width: var(--grid-cell); height: var(--grid-cell); 
            max-width: var(--max-grid-cell); max-height: var(--max-grid-cell); 
            background: var(--cell-empty); border-radius: 4px; 
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: inset 0 0 8px rgba(0, 240, 255, 0.1);
            transition: background 0.1s ease;
        }
        
        #tray { 
            margin-top: auto; margin-bottom: 20px; width: 100%; height: 120px; 
            display: flex; justify-content: space-evenly; align-items: center; 
            background: rgba(10, 16, 35, 0.6); border-top: 2px solid rgba(0,240,255,0.2);
            cursor: pointer;
        }
        .tray-item { transform: scale(0.5); transform-origin: center; pointer-events: none; }
        
        #drag-layer { 
            position: fixed; pointer-events: none; display: none; z-index: 4000; 
            opacity: 0.95; will-change: transform, top, left;
        }

        .p-cell { 
            width: var(--grid-cell); height: var(--grid-cell); 
            max-width: var(--max-grid-cell); max-height: var(--max-grid-cell); 
            border-radius: 4px;
        }

        /* Skin Themes */
        /* Theme 0: Neon Cyberpunk (Default) */
        .theme-cyber .color-0 { background: linear-gradient(135deg, #00f0ff, #007799); box-shadow: 0 0 12px rgba(0,240,255,0.8), inset 0 2px 4px #fff; }
        .theme-cyber .color-1 { background: linear-gradient(135deg, #ff007f, #99004c); box-shadow: 0 0 12px rgba(255,0,127,0.8), inset 0 2px 4px #fff; }
        .theme-cyber .color-2 { background: linear-gradient(135deg, #7000ff, #400099); box-shadow: 0 0 12px rgba(112,0,255,0.8), inset 0 2px 4px #fff; }
        .theme-cyber .color-3 { background: linear-gradient(135deg, #00ff66, #00993d); box-shadow: 0 0 12px rgba(0,255,102,0.8), inset 0 2px 4px #fff; }
        .theme-cyber .color-4 { background: linear-gradient(135deg, #ffeb3b, #998d00); box-shadow: 0 0 12px rgba(255,235,59,0.8), inset 0 2px 4px #fff; }
        .theme-cyber .color-5 { background: linear-gradient(135deg, #ff5722, #992300); box-shadow: 0 0 12px rgba(255,87,34,0.8), inset 0 2px 4px #fff; }
        .theme-cyber .color-6 { background: linear-gradient(135deg, #00e5ff, #006064); box-shadow: 0 0 12px rgba(0,229,255,0.8), inset 0 2px 4px #fff; }

        /* Theme 1: Matrix Code (Green Hacker) */
        .theme-matrix .color-0 { background: #00ff41; border: 1px solid #003b00; box-shadow: 0 0 8px #00ff41; }
        .theme-matrix .color-1 { background: #003b00; border: 1px solid #00ff41; box-shadow: inset 0 0 8px #00ff41; }
        .theme-matrix .color-2 { background: #008f11; border: 1px solid #00ff41; box-shadow: 0 0 10px #008f11; }
        .theme-matrix .color-3 { background: #00FF66; border: 1px solid #fff; box-shadow: 0 0 12px #00FF66; }
        .theme-matrix .color-4 { background: #005511; border: 1px solid #00ff41; box-shadow: 0 0 6px #00ff41; }
        .theme-matrix .color-5 { background: #00aa22; border: 1px solid #fff; box-shadow: 0 0 10px #00aa22; }
        .theme-matrix .color-6 { background: #00ffaa; border: 1px solid #003b00; box-shadow: 0 0 14px #00ffaa; }

        /* Theme 2: Golden Pharaoh (Gold & Lapis) */
        .theme-gold .color-0 { background: linear-gradient(135deg, #ffd700, #b8860b); box-shadow: 0 0 12px rgba(255,215,0,0.9), inset 0 2px 4px #fff; }
        .theme-gold .color-1 { background: linear-gradient(135deg, #002fa7, #001242); box-shadow: 0 0 12px rgba(0,47,167,0.9), inset 0 2px 4px #ffd700; }
        .theme-gold .color-2 { background: linear-gradient(135deg, #c0c0c0, #708090); box-shadow: 0 0 10px rgba(192,192,192,0.8); }
        .theme-gold .color-3 { background: linear-gradient(135deg, #daa520, #8b6508); box-shadow: 0 0 12px #daa520; }
        .theme-gold .color-4 { background: linear-gradient(135deg, #e5e4e2, #a9a9a9); box-shadow: 0 0 10px #e5e4e2; }
        .theme-gold .color-5 { background: linear-gradient(135deg, #ff4500, #8b0000); box-shadow: 0 0 12px #ff4500; }
        .theme-gold .color-6 { background: linear-gradient(135deg, #4b0082, #191970); box-shadow: 0 0 12px #4b0082; }

        /* Theme 3: Inferno Lava (Red & Orange Fire) */
        .theme-lava .color-0 { background: linear-gradient(135deg, #ff3300, #990000); box-shadow: 0 0 12px #ff3300; }
        .theme-lava .color-1 { background: linear-gradient(135deg, #ff9900, #cc6600); box-shadow: 0 0 12px #ff9900; }
        .theme-lava .color-2 { background: linear-gradient(135deg, #ff0055, #80002a); box-shadow: 0 0 12px #ff0055; }
        .theme-lava .color-3 { background: linear-gradient(135deg, #ffff00, #999900); box-shadow: 0 0 14px #ffff00; }
        .theme-lava .color-4 { background: linear-gradient(135deg, #ff6600, #993300); box-shadow: 0 0 10px #ff6600; }
        .theme-lava .color-5 { background: linear-gradient(135deg, #cc0000, #4d0000); box-shadow: 0 0 10px #cc0000; }
        .theme-lava .color-6 { background: linear-gradient(135deg, #ff6699, #990033); box-shadow: 0 0 12px #ff6699; }

        .preview { background: rgba(0, 240, 255, 0.3) !important; box-shadow: inset 0 0 10px var(--neon-blue), 0 0 15px rgba(0,240,255,0.8) !important; }
        .line-preview { background: linear-gradient(45deg, #00f0ff, #ff007f, #00f0ff) !important; opacity: 0.7; }

        #combo-popup {
            position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            z-index: 4500; font-weight: 900; font-size: 1.8rem; text-align: center;
            width: 90%; pointer-events: none; opacity: 0;
            background: linear-gradient(135deg, #fff, #00f0ff, #ff007f); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(0,240,255,0.9));
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #combo-popup.show { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }

        /* Shop Grid UI */
        .shop-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
            width: 100%; max-width: 360px; margin: 20px 0; max-height: 60vh; overflow-y: auto;
        }

        .shop-item {
            background: rgba(10, 16, 35, 0.8); border: 2px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px; padding: 12px; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between; position: relative;
        }
        .shop-item.active-skin { border-color: var(--cyber-green); box-shadow: 0 0 15px rgba(0, 255, 102, 0.4); }

        .skin-preview-box {
            display: grid; grid-template-columns: repeat(2, 20px); gap: 4px; margin: 10px 0;
        }
        .skin-cell { width: 20px; height: 20px; border-radius: 3px; }

        .buy-btn {
            padding: 6px 12px; font-size: 0.85rem; border-radius: 6px; border: none;
            font-weight: bold; cursor: pointer; width: 100%; font-family: inherit;
        }
        .buy-btn.purchased { background: #1e293b; color: var(--cyber-green); border: 1px solid var(--cyber-green); }
        .buy-btn.buy { background: var(--cyber-yellow); color: #000; box-shadow: 0 0 10px rgba(255, 235, 59, 0.4); }

    </style>
</head>
<body class="theme-cyber">

    <div id="settings-gear-container">
        <svg id="gear-icon" onclick="toggleSpeedPanel()" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19.43 12.98C19.47 12.66 19.5 12.34 19.5 12C19.5 11.66 19.47 11.34 19.43 11.02L21.54 9.37C21.73 9.22 21.78 8.95 21.66 8.73L19.66 5.27C19.54 5.05 19.27 4.97 19.05 5.05L16.56 6.05C16.04 5.65 15.48 5.32 14.87 5.07L14.49 2.42C14.46 2.18 14.25 2 14 2H10C9.75 2 9.54 2.18 9.51 2.42L9.13 5.07C8.52 5.32 7.96 5.66 7.44 6.05L4.95 5.05C4.73 4.96 4.46 5.05 4.34 5.27L2.34 8.73C2.21 8.95 2.27 9.22 2.46 9.37L4.57 11.02C4.53 11.34 4.5 11.67 4.5 12C4.5 12.33 4.53 12.66 4.57 12.98L2.46 14.63C2.27 14.78 2.22 15.05 2.34 15.27L4.34 18.73C4.46 18.95 4.73 19.03 4.95 18.95L7.44 17.95C7.96 18.35 8.52 18.68 9.13 18.93L9.51 21.58C9.54 21.82 9.75 22 10 22H14C14.25 22 14.46 21.82 14.49 18.93C15.48 18.67 16.04 18.34 16.56 17.95L19.05 18.95C19.27 19.04 19.54 18.95 19.66 18.73L21.66 15.27C21.78 15.05 21.73 14.78 21.54 14.63L19.43 12.98ZM12 15.5C10.07 15.5 8.5 13.93 8.5 12C8.5 10.07 10.07 8.5 12 8.5C13.93 8.5 15.5 10.07 15.5 12C15.5 13.93 13.93 15.5 12 15.5Z" fill="#00f0ff"/>
        </svg>
        <div id="speed-panel">
            <button class="speed-btn" id="sb-slow" onclick="setMovementSpeed('slow')">سلاسة هولوجرام</button>
            <button class="speed-btn active" id="sb-fast" onclick="setMovementSpeed('fast')">سرعة الليزر</button>
        </div>
    </div>

    <!-- Name Modal -->
    <div id="name-overlay">
        <h1 id="menu-title">VOID BLAST</h1>
        <p style="color: var(--neon-blue); font-size: 0.85rem; letter-spacing: 4px; text-transform: uppercase; margin-top:5px;">Cyberpunk Ultimate ⚡</p>
        <input type="text" id="player-name-input" class="input-style" placeholder="أدخل معرف القائد المستقبلي..." maxlength="10">
        <button class="btn-ui" onclick="saveName()">بدء الاتصال بالشبكة 🌐</button>
    </div>

    <!-- Main Menu -->
    <div id="multiplayer-menu" style="display: none;">
        <h2 style="color: var(--neon-blue); margin-bottom: 5px;">مرحباً بالقائد <span id="display-name"></span></h2>
        
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <button class="btn-ui" onclick="startSolo()">محاكاة فردية 🕹️</button>
            <button class="btn-ui" style="background: linear-gradient(45deg, #ffeb3b, #ff9900); color: #000;" onclick="openShop()">متجر السمات 🎨</button>
        </div>

        <hr style="width: 80%; border: 0.5px solid #1e293b; margin: 10px 0;">
        
        <button class="btn-ui" style="background: linear-gradient(45deg, #ff007f, #7000ff); color: #fff;" onclick="hostGame()">إنشاء سيرفر كمضيف (Host) ⚔️</button>
        
        <div id="host-info" style="display:none; font-size: 0.85rem; margin-top:10px; background: rgba(0,240,255,0.1); padding: 10px; border-radius: 8px; border: 1px solid var(--neon-blue);">
            كود السيرفر المفتوح: <b id="peer-id" style="color:var(--neon-blue); font-size:1.1rem;">جاري التشفير...</b> <br> 
            <button class="btn-ui" style="padding: 5px 15px; font-size: 0.8rem; margin-top: 8px;" onclick="copyRoomId()">نسخ المعرف 📋</button>
        </div>
        
        <button class="btn-ui" style="background: #030712; border: 1px solid var(--neon-blue); margin-top: 10px;" onclick="showJoinInput()">اختراق سيرفر (Join)</button>
        <div id="join-section" style="display:none;">
            <input type="text" id="join-id-input" class="input-style" placeholder="أدخل كود السيرفر">
            <button class="btn-ui" onclick="joinGame()">ربط العصبي الآن ⚡</button>
        </div>
    </div>

    <!-- Shop Modal -->
    <div id="shop-modal">
        <h2 style="color: var(--cyber-yellow); margin-top:0; filter: drop-shadow(0 0 10px var(--cyber-yellow));">🎨 متجر أشكال المربعات</h2>
        <div class="coin-box" style="margin-bottom: 10px;">
            <span class="coin-icon">🪙</span>
            <span id="shop-coin-count">0</span>
        </div>
        <div class="shop-grid" id="shop-grid"></div>
        <button class="btn-ui" style="background: #1e293b; border: 1px solid var(--neon-blue);" onclick="closeShop()">إغلاق المتجر ✖</button>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal">
        <h1 style="color:var(--neon-pink); font-size:2.5rem; margin: 10px;">انقطاع الاتصال! 💥</h1>
        <p style="font-size: 1.1rem; color: #94a3b8; margin: 0;">إجمالي الطاقة المكتسبة:</p>
        <p id="final-score" style="color:#fff; font-size:2.8rem; font-weight:900; margin:5px; text-shadow:0 0 20px var(--neon-blue);">0</p>
        <p style="color: var(--cyber-yellow); font-size: 1.1rem; margin-bottom: 15px;">العملات المكتسبة هذه الجولة: <span id="earned-coins">+0</span> 🪙</p>
        <button class="btn-ui" onclick="restartGame()">إعادة التشغيل 🔄</button>
    </div>

    <div id="combo-popup">إعادة شحن مذهلة! ⚡</div>

    <!-- Header Stats -->
    <div class="header-stats">
        <div class="score-container">
            <div class="score-box"><h2>طاقة القائد</h2><p id="score" style="color: var(--neon-blue)">0</p></div>
            <div class="coin-box" onclick="openShop()">
                <span class="coin-icon">🪙</span>
                <span id="coin-count">0</span>
            </div>
            <div id="opponent-box" class="score-box"><h2>المنافس: <span id="opp-name-label">...</span></h2><p id="opponent-score" style="color: var(--neon-pink)">0</p></div>
            <div class="score-box"><h2>أعلى رقم</h2><p id="best-score">0</p></div>
        </div>
    </div>

    <div id="grid-wrapper"><div id="grid"></div></div>
    <div id="tray"></div>
    <div id="drag-layer"></div>

    <script>
        // Expanded Shapes Collection (Smart system chooses intelligently)
        const ALL_SHAPES = [
            // Singles & Doubles
            {s: [[0,0]], weight: 1},
            {s: [[0,0],[0,1]], weight: 2},
            {s: [[0,0],[1,0]], weight: 2},
            // Triples & Lines
            {s: [[0,0],[0,1],[0,2]], weight: 3},
            {s: [[0,0],[1,0],[2,0]], weight: 3},
            {s: [[0,0],[0,1],[0,2],[0,3]], weight: 3},
            {s: [[0,0],[1,0],[2,0],[3,0]], weight: 3},
            // Squares & Blocks
            {s: [[0,0],[0,1],[1,0],[1,1]], weight: 4},
            {s: [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], weight: 5},
            // L & T Shapes
            {s: [[0,0],[1,0],[1,1]], weight: 3},
            {s: [[0,1],[1,1],[1,0]], weight: 3},
            {s: [[0,0],[1,0],[2,0],[2,1]], weight: 4},
            {s: [[0,1],[1,0],[1,1],[1,2]], weight: 4},
            {s: [[0,0],[0,1],[0,2],[1,1]], weight: 4},
            // Z & Diagonal
            {s: [[0,0],[0,1],[1,1],[1,2]], weight: 4},
            {s: [[0,1],[0,2],[1,0],[1,1]], weight: 4}
        ];

        const TEXTS = [
            "تفريغ طاقة نيترونية هائل! ⚡",
            "اختراق مصفوفة ممتازة! 🚀",
            "تحذير: أداء مستقبلي خارق! 🦾",
            "تدمير متسلسل ممتاز! 💥",
            "مكافأة طاقة الف نقطة! 🪙 +10"
        ];

        // Skins System Configuration
        const SKINS = [
            { id: 'theme-cyber', name: 'النيون المستقبلي', price: 0, class: 'theme-cyber', colors: ['#00f0ff', '#ff007f', '#7000ff', '#00ff66'] },
            { id: 'theme-matrix', name: 'مصفوفة الماتريكس', price: 50, class: 'theme-matrix', colors: ['#00ff41', '#003b00', '#008f11', '#00ffaa'] },
            { id: 'theme-gold', name: 'الفرعوني الذهبي', price: 100, class: 'theme-gold', colors: ['#ffd700', '#002fa7', '#c0c0c0', '#ff4500'] },
            { id: 'theme-lava', name: 'حمم البركان', price: 150, class: 'theme-lava', colors: ['#ff3300', '#ff9900', '#ffff00', '#cc0000'] }
        ];

        let score = 0, bestScore = parseInt(localStorage.getItem('best_shawky')) || 0;
        let coins = parseInt(localStorage.getItem('coins_shawky')) || 0;
        let unlockedSkins = JSON.parse(localStorage.getItem('unlocked_skins_shawky')) || ['theme-cyber'];
        let currentSkin = localStorage.getItem('current_skin_shawky') || 'theme-cyber';
        
        let lastCoinMilestone = 0;
        let sessionEarnedCoins = 0;

        let gridState = Array(64).fill(-1), activeS = null, activeC = 0, origP = null;
        let myName = "القائد", opponentName = "المنافس", isMultiplayer = false, peer, conn;

        let movementStyle = 'fast'; 
        let currentX = 0, currentY = 0, targetX = 0, targetY = 0;
        let isDragging = false;
        let animFrameId = null;
        let dragLayerEl = null;

        function applySkin(skinClass) {
            document.body.className = skinClass;
            currentSkin = skinClass;
            localStorage.setItem('current_skin_shawky', skinClass);
        }

        function toggleSpeedPanel() {
            const panel = document.getElementById('speed-panel');
            panel.style.display = (panel.style.display === 'flex') ? 'none' : 'flex';
        }

        function setMovementSpeed(speed) {
            movementStyle = speed;
            document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
            if(speed === 'fast') document.getElementById('sb-fast').classList.add('active');
            if(speed === 'slow') document.getElementById('sb-slow').classList.add('active');
            toggleSpeedPanel();
        }

        function saveName() {
            const val = document.getElementById('player-name-input').value.trim();
            if(val) myName = val;
            document.getElementById('display-name').innerText = myName;
            document.getElementById('name-overlay').style.display = 'none';
            document.getElementById('multiplayer-menu').style.display = 'flex';
            initPeer();
        }

        function initPeer() {
            peer = new Peer();
            peer.on('open', (id) => { 
                document.getElementById('peer-id').innerText = id; 
            });

            peer.on('connection', (c) => {
                conn = c;
                setupConnectionHandlers();
            });
        }

        function hostGame() { 
            document.getElementById('host-info').style.display = 'block'; 
        }

        function copyRoomId() {
            const idText = document.getElementById('peer-id').innerText;
            if(idText && idText !== 'جاري التشفير...') {
                navigator.clipboard.writeText(idText);
                alert("تم نسخ معرف السيرفر بنجاح! ⚡");
            }
        }

        function showJoinInput() { 
            document.getElementById('join-section').style.display = 'block'; 
        }

        function joinGame() {
            const targetId = document.getElementById('join-id-input').value.trim();
            if(!targetId) return alert("أدخل كود السيرفر أولاً");
            conn = peer.connect(targetId);
            setupConnectionHandlers();
        }

        function setupConnectionHandlers() {
            conn.on('open', () => {
                isMultiplayer = true;
                conn.send({type: 'INIT', name: myName});

                conn.on('data', (data) => {
                    if(data.type === 'INIT') {
                        opponentName = data.name;
                        document.getElementById('opp-name-label').innerText = opponentName;
                        conn.send({type: 'WELCOME', name: myName});
                        alert(`انضم القائد المستقبلي (${opponentName}) للمحاكاة!`);
                        startMultiplayer();
                    }
                    if(data.type === 'WELCOME') {
                        opponentName = data.name;
                        document.getElementById('opp-name-label').innerText = opponentName;
                        alert(`تم الربط مع القائد (${opponentName}) بنجاح!`);
                        startMultiplayer();
                    }
                    if(data.type === 'SCORE') {
                        document.getElementById('opponent-score').innerText = data.score;
                    }
                });
            });
        }

        function startSolo() { 
            document.getElementById('multiplayer-menu').style.display = 'none'; 
            startGame(); 
        }

        function startMultiplayer() {
            document.getElementById('multiplayer-menu').style.display = 'none';
            document.getElementById('opponent-box').style.display = 'block';
            startGame();
        }

        /* Audio Synth */
        let audioCtx;
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSound(freq, duration, type='sine') {
            try {
                const ctx = getAudioCtx(); const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime); gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + duration);
                osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + duration);
            } catch(e){}
        }

        window.onload = () => {
            dragLayerEl = document.getElementById('drag-layer');
            applySkin(currentSkin);
            initGrid();
            updateCoinDisplay();
            document.getElementById('best-score').innerText = bestScore;
            
            const tray = document.getElementById('tray');
            tray.addEventListener('touchstart', handleTrayTouch, {passive: false});
            tray.addEventListener('mousedown', handleTrayMouseDown);
        };

        function initGrid() {
            const grid = document.getElementById('grid'); grid.innerHTML = '';
            for(let i=0; i<64; i++) {
                const d = document.createElement('div'); d.className = 'cell'; d.id = 'c' + i; grid.appendChild(d);
            }
        }

        function startGame() {
            score = 0; lastCoinMilestone = 0; sessionEarnedCoins = 0;
            gridState.fill(-1);
            document.querySelectorAll('.cell').forEach(c => { c.className = 'cell'; c.style.background = ''; c.style.boxShadow = ''; });
            updateScoreDisplay(); spawnSmartTray();
        }

        function restartGame() {
            document.getElementById('game-over-modal').style.display = 'none';
            startGame();
        }

        /* SMART TRAY GENERATION ENGINE */
        function spawnSmartTray() {
            const tray = document.getElementById('tray'); tray.innerHTML = '';
            let emptyCells = [];
            for(let i=0; i<64; i++) { if(gridState[i] === -1) emptyCells.push(i); }

            // Evaluate board status
            const filledCount = 64 - emptyCells.length;
            const isDangerZone = filledCount > 40; // Board is tight

            for(let i=0; i<3; i++) {
                let selectedShape = null;

                if (isDangerZone) {
                    // Smart Rescue Mode: Guarantee shapes that fits safely
                    let validFitting = ALL_SHAPES.filter(sh => emptyCells.some(cellId => canFit(sh.s, cellId)));
                    if (validFitting.length > 0) {
                        // Prefer smaller shapes when danger is high
                        validFitting.sort((a,b) => a.weight - b.weight);
                        selectedShape = validFitting[Math.floor(Math.random() * Math.min(3, validFitting.length))];
                    }
                } else {
                    // Dynamic AI Balancing
                    let validFitting = ALL_SHAPES.filter(sh => emptyCells.some(cellId => canFit(sh.s, cellId)));
                    if (validFitting.length > 0 && Math.random() < 0.85) {
                        selectedShape = validFitting[Math.floor(Math.random() * validFitting.length)];
                    }
                }

                // Fallback random shape
                if (!selectedShape) {
                    selectedShape = ALL_SHAPES[Math.floor(Math.random() * ALL_SHAPES.length)];
                }

                const col = Math.floor(Math.random() * 7);
                const p = document.createElement('div');
                p.className = 'tray-item'; p.style.display = 'grid'; p.style.gap = '4px';
                p.dataset.shape = JSON.stringify(selectedShape.s); p.dataset.color = col;
                
                const rs = Math.max(...selectedShape.s.map(x=>x[0]))+1, cs = Math.max(...selectedShape.s.map(x=>x[1]))+1;
                p.style.gridTemplateRows = `repeat(${rs}, 1fr)`; p.style.gridTemplateColumns = `repeat(${cs}, 1fr)`;
                
                selectedShape.s.forEach(pos => {
                    const c = document.createElement('div'); c.className = `p-cell color-${col}`;
                    c.style.gridRowStart = pos[0]+1; c.style.gridColumnStart = pos[1]+1; p.appendChild(c);
                });
                tray.appendChild(p);
            }
            checkGameOver();
        }

        function handleTrayTouch(e) {
            getAudioCtx(); if(activeS) return;
            const touch = e.touches[0];
            findAndStartDrag(touch.clientX, touch.clientY, true);
            if(activeS) e.preventDefault();
        }

        function handleTrayMouseDown(e) {
            getAudioCtx(); if(activeS) return;
            findAndStartDrag(e.clientX, e.clientY, false);
        }

        function findAndStartDrag(clientX, clientY, isTouch) {
            const trayItems = document.querySelectorAll('.tray-item');
            let closestItem = null, minDistance = 80;
            trayItems.forEach(item => {
                const rect = item.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2, centerY = rect.top + rect.height / 2;
                const distance = Math.hypot(clientX - centerX, clientY - centerY);
                if (distance < minDistance) { minDistance = distance; closestItem = item; }
            });
            if (closestItem) { 
                startDrag(clientX, clientY, closestItem, JSON.parse(closestItem.dataset.shape), parseInt(closestItem.dataset.color), isTouch); 
            }
        }

        function startDrag(clientX, clientY, p, s, c, isTouch) {
            activeS = s; activeC = c; origP = p;
            dragLayerEl.innerHTML = p.innerHTML; dragLayerEl.style.display = 'grid';
            dragLayerEl.style.gridTemplateRows = p.style.gridTemplateRows;
            dragLayerEl.style.gridTemplateColumns = p.style.gridTemplateColumns;
            dragLayerEl.style.gap = '4px'; p.style.visibility = 'hidden';
            
            const offset = isTouch ? 95 : 0;
            targetX = clientX; targetY = clientY - offset;
            currentX = targetX; currentY = targetY;
            isDragging = true;
            
            updateDragPreviews();

            if(!animFrameId) {
                animFrameId = requestAnimationFrame(smoothRenderLoop);
            }
        }

        function smoothRenderLoop() {
            if (isDragging && activeS) {
                if (movementStyle === 'slow') {
                    currentX += (targetX - currentX) * 0.22;
                    currentY += (targetY - currentY) * 0.22;
                } else {
                    currentX = targetX;
                    currentY = targetY;
                }
                dragLayerEl.style.left = currentX + 'px';
                dragLayerEl.style.top = currentY + 'px';
                dragLayerEl.style.transform = 'translate(-50%, -50%) scale(1.08)';
                
                animFrameId = requestAnimationFrame(smoothRenderLoop);
            } else {
                animFrameId = null;
            }
        }

        window.addEventListener('touchmove', e => { 
            if(activeS) { 
                e.preventDefault(); 
                targetX = e.touches[0].clientX;
                targetY = e.touches[0].clientY - 95;
                updateDragPreviews();
            } 
        }, {passive: false});

        window.addEventListener('mousemove', e => {
            if(activeS) {
                targetX = e.clientX;
                targetY = e.clientY;
                updateDragPreviews();
            }
        });

        function updateDragPreviews() {
            document.querySelectorAll('.preview, .line-preview').forEach(el => el.classList.remove('preview', 'line-preview'));
            const ms = getMatches();
            if(ms.length === activeS.length) {
                ms.forEach(id => document.getElementById('c'+id).classList.add('preview'));
                getPotentialLines(ms).forEach(id => document.getElementById('c'+id).classList.add('line-preview'));
            }
        }

        function getMatches() {
            const pCells = dragLayerEl.querySelectorAll('.p-cell');
            if (pCells.length === 0) return [];
            const r = pCells[0].getBoundingClientRect();
            const target = document.elementFromPoint(r.left + r.width/2, r.top + r.height/2);
            const cell = target?.closest('.cell');
            if (!cell) return [];
            const baseId = parseInt(cell.id.replace('c', ''));
            const baseRow = Math.floor(baseId / 8), baseCol = baseId % 8;
            let ms = []; const startR = activeS[0][0], startC = activeS[0][1];
            for (let i = 0; i < activeS.length; i++) {
                const rOff = activeS[i][0] - startR, cOff = activeS[i][1] - startC;
                const tr = baseRow + rOff, tc = baseCol + cOff;
                if (tr >= 0 && tr < 8 && tc >= 0 && tc < 8) {
                    const id = tr * 8 + tc; if (gridState[id] === -1) ms.push(id); else return [];
                } else return [];
            }
            return ms;
        }

        function getPotentialLines(matches) {
            let lines = new Set(), tempGrid = [...gridState];
            matches.forEach(id => tempGrid[id] = activeC); 
            for(let i=0; i<8; i++) {
                let row = [], col = [];
                for(let j=0; j<8; j++) { row.push(i*8+j); col.push(j*8+i); }
                if(row.every(id => tempGrid[id] !== -1)) row.forEach(id => lines.add(id));
                if(col.every(id => tempGrid[id] !== -1)) col.forEach(id => lines.add(id));
            }
            return lines;
        }
        
        function endDrag() {
            if(!activeS) return;
            isDragging = false;
            const ms = getMatches();
            if(ms.length === activeS.length) {
                playSound(580, 0.08, 'sine'); 
                ms.forEach(id => { gridState[id] = activeC; document.getElementById('c'+id).className = `cell color-${activeC}`; });
                score += activeS.length * 10; origP.remove(); checkLines();
                if(document.getElementById('tray').children.length === 0) spawnSmartTray(); else checkGameOver();
                updateScoreDisplay();
            } else { origP.style.visibility = 'visible'; }
            dragLayerEl.style.display = 'none'; activeS = null;
            document.querySelectorAll('.preview, .line-preview').forEach(el => el.classList.remove('preview', 'line-preview'));
        }

        window.addEventListener('touchend', endDrag);
        window.addEventListener('mouseup', endDrag);

        function checkLines() {
            let toClear = new Set();
            for(let i=0; i<8; i++) {
                let r = [], c = [];
                for(let j=0; j<8; j++) { r.push(i*8+j); c.push(j*8+i); }
                if(r.every(id => gridState[id] !== -1)) r.forEach(id => toClear.add(id));
                if(c.every(id => gridState[id] !== -1)) c.forEach(id => toClear.add(id));
            }
            if(toClear.size > 0) {
                playSound(680, 0.25, 'triangle'); 
                toClear.forEach(id => { gridState[id] = -1; document.getElementById('c'+id).className = 'cell'; });
                score += toClear.size * 25; showComboPopup();
            }
        }

        function showComboPopup() {
            const pop = document.getElementById('combo-popup');
            pop.innerText = TEXTS[Math.floor(Math.random() * TEXTS.length)];
            pop.classList.add('show'); setTimeout(() => pop.classList.remove('show'), 1800);
        }

        function updateScoreDisplay() {
            document.getElementById('score').innerText = score;
            
            // Check 1000 Score Milestone for Coins Reward (+10 Coins per 1000 PTS)
            const currentMilestone = Math.floor(score / 1000);
            if (currentMilestone > lastCoinMilestone) {
                const addedCoins = (currentMilestone - lastCoinMilestone) * 10;
                coins += addedCoins;
                sessionEarnedCoins += addedCoins;
                lastCoinMilestone = currentMilestone;
                updateCoinDisplay();
                playSound(880, 0.3, 'square');
                showComboPopup();
            }

            if(score > bestScore) { 
                bestScore = score; document.getElementById('best-score').innerText = bestScore; 
                localStorage.setItem('best_shawky', bestScore); 
            }
            if(isMultiplayer && conn && conn.open) conn.send({type: 'SCORE', score: score});
        }

        function updateCoinDisplay() {
            localStorage.setItem('coins_shawky', coins);
            document.getElementById('coin-count').innerText = coins;
            document.getElementById('shop-coin-count').innerText = coins;
        }

        /* SHOP SYSTEM FUNCTIONS */
        function openShop() {
            renderShop();
            document.getElementById('shop-modal').style.display = 'flex';
        }

        function closeShop() {
            document.getElementById('shop-modal').style.display = 'none';
        }

        function renderShop() {
            const grid = document.getElementById('shop-grid');
            grid.innerHTML = '';
            
            SKINS.forEach(skin => {
                const isUnlocked = unlockedSkins.includes(skin.id);
                const isActive = (currentSkin === skin.class);

                const item = document.createElement('div');
                item.className = `shop-item ${isActive ? 'active-skin' : ''}`;
                
                let previewHtml = `<div class="skin-preview-box ${skin.class}">`;
                skin.colors.forEach((col, idx) => {
                    previewHtml += `<div class="skin-cell color-${idx}"></div>`;
                });
                previewHtml += `</div>`;

                let btnHtml = '';
                if(isActive) {
                    btnHtml = `<button class="buy-btn purchased">مُفعل حالياً ✨</button>`;
                } else if(isUnlocked) {
                    btnHtml = `<button class="buy-btn purchased" onclick="selectSkin('${skin.id}')">تفعيل الشكل 🚀</button>`;
                } else {
                    btnHtml = `<button class="buy-btn buy" onclick="buySkin('${skin.id}')">شراء 🪙 ${skin.price}</button>`;
                }

                item.innerHTML = `
                    <span style="font-weight:bold; font-size:0.95rem; color:#fff;">${skin.name}</span>
                    ${previewHtml}
                    ${btnHtml}
                `;
                grid.appendChild(item);
            });
        }

        function buySkin(skinId) {
            const skin = SKINS.find(s => s.id === skinId);
            if(!skin) return;

            if(coins >= skin.price) {
                coins -= skin.price;
                unlockedSkins.push(skin.id);
                localStorage.setItem('unlocked_skins_shawky', JSON.stringify(unlockedSkins));
                updateCoinDisplay();
                selectSkin(skinId);
                playSound(750, 0.2, 'sine');
            } else {
                alert("عفواً! ليس لديك عملات كافية. العب واحصل على 10 عملات لكل 1000 نقطة! 🪙");
            }
        }

        function selectSkin(skinId) {
            const skin = SKINS.find(s => s.id === skinId);
            if(skin) {
                applySkin(skin.class);
                renderShop();
            }
        }

        function checkGameOver() {
            const items = document.querySelectorAll('.tray-item'); let canPlaceAny = false;
            items.forEach(item => {
                const shape = JSON.parse(item.dataset.shape);
                for (let i = 0; i < 64; i++) { if (canFit(shape, i)) { canPlaceAny = true; break; } }
            });
            if (!canPlaceAny && items.length > 0) {
                document.getElementById('final-score').innerText = score;
                document.getElementById('earned-coins').innerText = `+${sessionEarnedCoins}`;
                document.getElementById('game-over-modal').style.display = 'flex';
            }
        }

        function canFit(shape, baseId) {
            const baseRow = Math.floor(baseId / 8), baseCol = baseId % 8;
            for (let i = 0; i < shape.length; i++) {
                const tr = baseRow + (shape[i][0] - shape[0][0]), tc = baseCol + (shape[i][1] - shape[0][1]);
                if (tr < 0 || tr >= 8 || tc < 0 || tc >= 8 || gridState[tr * 8 + tc] !== -1) return false;
            }
            return true;
        }
    </script>
</body>
